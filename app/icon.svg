<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0B1120" rx="22" />
  
  <defs>
    <!-- Gradients for the Z lines (using userSpaceOnUse to fix horizontal line gradient bug) -->
    <linearGradient id="topLine" x1="26" y1="30" x2="74" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#00D0FF" />
    </linearGradient>
    <linearGradient id="diagLine" x1="74" y1="30" x2="26" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D0FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="bottomLine" x1="26" y1="70" x2="74" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    
    <!-- Glow effect for lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Z Lines (Opaque to prevent messy overlaps) -->
  <g filter="url(#glow)" stroke-width="12" stroke-linecap="round">
    <!-- Top Line -->
    <line x1="26" y1="30" x2="74" y2="30" stroke="url(#topLine)" />
    <!-- Diagonal -->
    <line x1="74" y1="30" x2="26" y2="70" stroke="url(#diagLine)" />
    <!-- Bottom Line -->
    <line x1="26" y1="70" x2="74" y2="70" stroke="url(#bottomLine)" />
  </g>

  <!-- Solid Dots on Corners (Placed above lines to cover joints cleanly) -->
  <circle cx="26" cy="30" r="8" fill="#C084FC" />
  <circle cx="74" cy="30" r="8" fill="#00D0FF" />
  <circle cx="26" cy="70" r="8" fill="#7C3AED" />
  <circle cx="74" cy="70" r="8" fill="#FFFFFF" />
</svg>
